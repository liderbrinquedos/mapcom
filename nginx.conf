server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O HTML embute a base de população do Censo (145 KB+) — gzip derruba para ~1/3
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
}
